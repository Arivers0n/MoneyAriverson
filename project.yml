name: Koshelek
options:
  bundleIdPrefix: ru.koshelek
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  Koshelek:
    type: application
    platform: iOS
    sources:
      - path: Koshelek
    dependencies:
      - target: KoshelekWidget
        embed: true
    info:
      path: Koshelek/Info.plist
      properties:
        CFBundleDisplayName: Кошелёк
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы записывать траты голосом.
        NSSpeechRecognitionUsageDescription: Распознавание речи превращает ваш рассказ в текст, чтобы записать траты.
        NSCameraUsageDescription: Камера нужна, чтобы сфотографировать чек или график платежей.
        NSPhotoLibraryUsageDescription: Доступ к фото нужен, чтобы выбрать скриншот чека или графика платежей.
        CFBundleURLTypes:
          - CFBundleURLName: ru.koshelek.app
            CFBundleURLSchemes: [koshelek]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.koshelek.app
        PRODUCT_NAME: Koshelek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme: {}
  KoshelekWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KoshelekWidget
    info:
      path: KoshelekWidget/Info.plist
      properties:
        CFBundleDisplayName: Кошелёк
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.koshelek.app.widget
        PRODUCT_NAME: KoshelekWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
