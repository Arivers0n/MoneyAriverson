name: Скриншоты Вдвоём (симулятор)

# Собирает приложение для симулятора iOS, снимает экраны в демо-режиме
# и кладёт PNG в ветку vdvoem-screens (и в артефакт сборки).
# Запускается только вручную (Actions → Run workflow): macOS-серверы дефицитны, на каждый пуш не тратим.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Mac-сервер (если обычные заняты — macos-15-intel)'
        default: 'macos-15'

permissions:
  contents: write

concurrency:
  group: vdvoem-screens
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Выбрать самый новый Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Установить XcodeGen и собрать проект
        working-directory: Vdvoem
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Собрать для симулятора
        working-directory: Vdvoem
        run: |
          set +e
          xcodebuild -project Vdvoem.xcodeproj -scheme Vdvoem -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          code=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -60
          exit $code

      - name: Запустить симулятор
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c=c or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      - name: Установить приложение
        run: xcrun simctl install "$UDID" Vdvoem/build/Build/Products/Debug-iphonesimulator/Vdvoem.app

      - name: Снять экраны
        run: |
          mkdir -p shots
          shot() { # имя, аргументы запуска...
            name=$1; shift
            xcrun simctl terminate "$UDID" ru.vdvoem.app >/dev/null 2>&1 || true
            sleep 3
            xcrun simctl launch "$UDID" ru.vdvoem.app "$@"
            # Приложение могло упасть на старте: убеждаемся, что оно живо, иначе запускаем ещё раз.
            sleep 4
            if ! xcrun simctl spawn "$UDID" launchctl list | grep -q ru.vdvoem.app; then
              echo "$name: приложение не запущено, перезапуск"
              xcrun simctl launch "$UDID" ru.vdvoem.app "$@"
            fi
            # Ждём, пока вместо пустого белого кадра появится интерфейс.
            for try in 1 2 3 4 5 6; do
              sleep 6
              xcrun simctl io "$UDID" screenshot "shots/$name.png"
              [ "$(stat -f%z "shots/$name.png")" -gt 150000 ] && break
              echo "$name: кадр пустой, попытка $try"
            done
          }
          # Каждый вариант «Сегодня» — в светлой и тёмной теме, вместе с доком (как в приложении).
          while read -u 3 st light dark; do
            shot "$st-1-$light"  -demo today-root -layout $st -theme $light -scheme light
            shot "$st-2-$dark"   -demo today-root -layout $st -theme $dark -scheme dark
          done 3<<'LIST'
          pismo paper lagoon
          dvoe cherry cosmos
          scena sunset lagoon
          widgets lilac aurora
          journal mocha espresso
          lenta ocean neon
          fridge pistachio amber
          pogoda rose cosmos
          foto lagoon cherry
          bilet retro lilac
          kasseta toy ocean
          okna malachite grainient
          racia grainient malachite
          ostrova lagoon rose
          classic lagoon lagoon
          LIST
          shot appearance-today      -demo appearance -scroll today -theme cherry
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: Vdvoem-screens
          path: shots

      - name: Выложить в ветку vdvoem-screens
        run: |
          cd shots
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q -b vdvoem-screens
          git add .
          git commit -q -m "Скриншоты ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" vdvoem-screens
