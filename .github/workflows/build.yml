name: Сборка .ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Выбрать самый новый Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект
        run: xcodegen generate

      - name: Собрать
        run: |
          set -o pipefail
          xcodebuild -project Koshelek.xcodeproj -scheme Koshelek -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Koshelek.app

      - name: Ошибки компиляции
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Упаковать .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Koshelek.app Payload/
          zip -qry Koshelek.ipa Payload
          ls -lh Koshelek.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Koshelek-ipa
          path: Koshelek.ipa

      - name: Выложить в релиз «latest»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Кошелёк — последняя сборка
          body: "Неподписанный .ipa. Подпишите своим сертификатом (ESign, Sideloadly и т.п.). Сборка ${{ github.sha }}."
          files: Koshelek.ipa
          make_latest: true
