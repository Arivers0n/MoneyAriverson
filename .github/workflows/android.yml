name: Сборка Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testDebugUnitTest --console=plain
          cp app/build/outputs/apk/release/app-release.apk ../Kopilka.apk

      - name: Снимки экранов
        uses: actions/upload-artifact@v4
        with:
          name: android-screens
          path: android/app/build/screens

      - uses: actions/upload-artifact@v4
        with:
          name: Kopilka-apk
          path: Kopilka.apk

      - name: Выложить в релиз «latest»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: Kopilka.apk

      # Сервер Копилки раздаёт APK приложениям — так Android обновляется сам вслед за iPhone.
      - name: Отправить обновление на сервер
        continue-on-error: true
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          NOTES=$(printf '%s' "$MSG" | head -n1 | cut -c1-200)
          curl -fsS -X POST "https://2-27-25-140.sslip.io:8443/api/collections/kp_builds/records" \
            -H "X-Kp-Upload: d0e5ad0614dc1beb6893c73086e152fc8d57f80c" \
            -F "version=${{ github.run_number }}" \
            -F "name=1.0.${{ github.run_number }}" \
            -F "notes=$NOTES" \
            -F "apk=@Kopilka.apk;type=application/vnd.android.package-archive"
